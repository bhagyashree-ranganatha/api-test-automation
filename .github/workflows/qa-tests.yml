name: QA Automation Suite

# This allows you to manually click a "Run" button in GitHub (just like the Render PoC idea)
on:
  workflow_dispatch:

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run REST Assured Tests
        run: mvn clean test